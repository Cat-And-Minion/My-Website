<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung, Pham Minh - Personal Blog</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Style -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Topbar  -->
    <div class="topbar">
        <div class="topbar-left">
            <span>Hello nice people, welcome to my blog</span>
            <span class="email">minhtrungphamsg@gmail.com</span>
        </div>
        <div class="topbar-right">
            <div class="search-box">
                <input type="text" placeholder="Search">
                <button>🔍</button>
            </div>
        </div>
    </div>

    <!-- 2. Logo Body -->
    <div class="logo-container">
        <div class="logo-text">Trung, Pham Minh</div>
        <div class="logo-sub">PERSONAL BLOG</div>
    </div>

    <!-- 3. Menu Bar  -->
    <div class="navbar">
        <div class="nav-item active">HOME ▾</div>
        <div class="nav-item">FEATURED</div>
        <div class="nav-item">ABOUT</div>
        <div class="nav-item">CATEGORIES</div>
        <div class="nav-item">CONTACT</div>
    </div>

    <!-- 4. Hero Banner -->
    <div class="hero-banner">
        <!-- Arrow Left/Right -->
        <div class="slider-arrow left">❮</div>
        <div class="slider-arrow right">❯</div>

        <!-- content on image -->
        <div class="hero-card">
            <div class="tag">TRAVEL</div>
            <div class="title">Travel and Live</div>
            <div class="date">day/month/year...</div>
        </div>

        <!-- Dots for page -->
        <div class="slider-dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
